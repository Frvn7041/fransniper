name: Vigilar disponibilidad en GAME

on:
  schedule:
    # Cada 10 minutos, todo el día. Los horarios de GitHub Actions van en UTC.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # te permite lanzarlo a mano desde la pestaña Actions

# Necesario para que el job pueda hacer commit del archivo state.json
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar comprobación
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_game.py

      - name: Guardar el estado para la próxima ejecución
        run: |
          git config user.name "game-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Actualizar estado [skip ci]"
          git push
