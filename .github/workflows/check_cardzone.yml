name: Vigilar 30 Aniversario en CardZone

on:
  schedule:
    # Cada 5 minutos, todo el día. Los horarios de GitHub Actions van en UTC.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar comprobación
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_cardzone.py

      - name: Guardar el estado para la próxima ejecución
        run: |
          git config user.name "cardzone-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_cardzone.json
          git diff --staged --quiet || git commit -m "Actualizar estado CardZone [skip ci]"
          git push
